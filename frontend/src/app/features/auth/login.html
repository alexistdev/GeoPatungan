<main class="auth">
  <h1>Masuk ke GeoPatungan</h1>
  <p class="muted">Arisan online yang transparan.</p>

  <form class="card stack" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (error(); as msg) {
      <div class="alert error" role="alert">{{ msg }}</div>
    }

    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" inputmode="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <p class="err">Masukkan email yang valid.</p>
      }
    </label>

    <label class="field">
      <span>Kata sandi</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <p class="err">Kata sandi wajib diisi.</p>
      }
    </label>

    <button class="btn primary block" type="submit" [disabled]="loading()">
      {{ loading() ? 'Memproses…' : 'Masuk' }}
    </button>
  </form>

  <p class="muted small">Belum punya akun? <a routerLink="/daftar">Daftar</a></p>
</main>
