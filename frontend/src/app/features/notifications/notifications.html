<app-page-title title="Notifikasi" />

<div class="card">
  <div class="card-header d-flex flex-wrap gap-2 justify-content-between align-items-center">
    <div class="btn-group" role="group" aria-label="Filter">
      <button type="button" class="btn" [class.btn-primary]="!unreadOnly()" [class.btn-light]="unreadOnly()" (click)="setFilter(false)">Semua</button>
      <button type="button" class="btn" [class.btn-primary]="unreadOnly()" [class.btn-light]="!unreadOnly()" (click)="setFilter(true)">
        Belum dibaca ({{ service.unread() }})
      </button>
    </div>
    <button type="button" class="btn btn-soft-primary" (click)="markAll()" [disabled]="service.unread() === 0">
      <i class="ri-check-double-line align-bottom me-1"></i> Tandai semua dibaca
    </button>
  </div>

  <div class="card-body">
    @if (error(); as msg) {
      <div class="alert alert-danger" role="alert">{{ msg }}</div>
    }

    @if (loading()) {
      <p class="text-muted mb-0">Memuat…</p>
    } @else if (items().length === 0) {
      <p class="text-muted mb-0">{{ unreadOnly() ? 'Tidak ada yang belum dibaca.' : 'Belum ada notifikasi.' }}</p>
    } @else {
      <ul class="list-group list-group-flush">
        @for (n of items(); track n.id) {
          <li class="list-group-item px-0">
            <button type="button" class="item btn btn-link text-start text-decoration-none w-100 p-0 d-block" (click)="open(n)">
              <span class="d-flex align-items-center fw-semibold" [class.text-primary]="!n.read" [class.text-body]="n.read">
                @if (!n.read) {
                  <span class="dot bg-primary rounded-circle d-inline-block me-2" style="width: 8px; height: 8px" aria-label="Belum dibaca"></span>
                }
                {{ n.title }}
              </span>
              <span class="d-block text-body">{{ n.body }}</span>
              <span class="d-block fs-12 text-muted">{{ n.created_at | date: 'd MMM y, HH:mm' }}</span>
            </button>
          </li>
        }
      </ul>
      @if (next() !== null) {
        <button type="button" class="btn btn-light w-100 mt-3" (click)="more()" [disabled]="loadingMore()">
          {{ loadingMore() ? 'Memuat…' : 'Muat lebih banyak' }}
        </button>
      }
    }
  </div>
</div>
